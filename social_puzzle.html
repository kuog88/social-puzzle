<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>石虎探險家・臺灣拼圖大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. 色彩與基礎設定
   ========================================================= */
:root{
  --parchment:#fbefd0;
  --parchment-dark:#f0d9a4;
  --ink:#4a3420;
  --ink-soft:#7a5a3a;
  --orange:#ff8a3d;
  --orange-dark:#e5671a;
  --green:#3fae6a;
  --green-dark:#2b8a50;
  --sea:#9fdcec;
  --sea-dark:#5fb7d4;
  --gold:#ffc94a;
  --red:#e8565a;
  --white:#fffdf7;
  --shadow:0 6px 0 rgba(74,52,32,.18), 0 10px 24px rgba(74,52,32,.18);
  --radius:22px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;
  font-size:18px;
  font-weight:500;
  color:var(--ink);
  background-color:#e9cf93;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.35) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.25) 0 2px, transparent 3px),
    radial-gradient(ellipse at 50% 0%, #f7e2ad 0%, #e9cf93 70%);
  background-size:60px 60px, 90px 90px, 100% 100%;
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer}

.app{
  display:flex;flex-direction:column;gap:10px;
  max-width:1400px;min-height:100dvh;margin:0 auto;
  padding:10px 12px 14px;
}

/* =========================================================
   2. 頂部資訊列
   ========================================================= */
.topbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  background:linear-gradient(180deg,#8b5a2b,#6e4520);
  color:var(--white);
  border-radius:var(--radius);
  padding:10px 16px;
  box-shadow:var(--shadow);
  border:3px solid #4a2e14;
}
.topbar h1{
  flex:1 1 100%;
  margin:0;font-size:clamp(20px,4.6vw,30px);font-weight:900;letter-spacing:1px;
  text-shadow:0 3px 0 #3b220c;
}
.topbar h1 .tag{font-size:.75em;margin-right:4px}
.progress-wrap{flex:1 1 200px;display:flex;align-items:center;gap:10px}
.progress-label{font-weight:900;white-space:nowrap;font-size:17px}
.progress{
  flex:1;height:18px;border-radius:99px;background:#3b220c;overflow:hidden;
  border:2px solid #f5d38a;
}
.progress-fill{
  height:100%;width:0;border-radius:99px;
  background:repeating-linear-gradient(45deg,var(--gold) 0 12px,#ffdf85 12px 24px);
  transition:width .6s cubic-bezier(.3,1.4,.5,1);
}
.score{
  display:flex;align-items:center;gap:6px;
  background:var(--gold);color:var(--ink);font-weight:900;
  padding:4px 14px;border-radius:99px;font-size:19px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);
}
.score.bump{animation:bump .5s}
.icon-btn{
  border:none;background:rgba(255,255,255,.18);color:var(--white);
  width:42px;height:42px;border-radius:50%;font-size:20px;
}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}}

@media (min-width:700px){
  .topbar h1{flex:1 1 auto}
  .progress-wrap{flex:0 1 320px}
}

/* =========================================================
   3. 主遊戲區：預設為手機上下排列
   ========================================================= */
.game{
  flex:1;display:grid;grid-template-columns:1fr;gap:12px;align-content:start;
}
.panel{
  position:relative;
  background:var(--parchment);
  border-radius:var(--radius);
  border:3px solid #c79a55;
  box-shadow:var(--shadow);
  padding:12px;
}
/* 拖曳時讓碎片區疊在地圖區上方 */
.map-panel{z-index:1}
.pieces-panel{z-index:5}
.panel::before{ /* 藏寶圖四角的虛線框 */
  content:"";position:absolute;inset:6px;border:2px dashed rgba(122,90,58,.35);
  border-radius:calc(var(--radius) - 6px);pointer-events:none;
}

/* ---- 吉祥物對話框 ---- */
.guide{display:flex;align-items:flex-end;gap:8px}
.mascot{width:78px;height:78px;flex:0 0 auto;filter:drop-shadow(0 3px 0 rgba(74,52,32,.25))}
.mascot.happy{animation:hop .6s}
.mascot.sad{animation:tilt .6s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
.bubble{
  position:relative;flex:1;
  background:var(--white);border:3px solid var(--ink);border-radius:18px;
  padding:8px 14px 10px;margin-bottom:6px;
}
.bubble::before{ /* 對話框尾巴 */
  content:"";position:absolute;left:-14px;bottom:14px;
  border-width:9px 14px 9px 0;border-style:solid;border-color:transparent var(--ink) transparent transparent;
}
.bubble::after{
  content:"";position:absolute;left:-9px;bottom:16px;
  border-width:7px 11px 7px 0;border-style:solid;border-color:transparent var(--white) transparent transparent;
}
.unit-tag{
  display:inline-block;font-size:14px;font-weight:900;color:var(--white);
  background:var(--green);border-radius:99px;padding:1px 10px;margin-bottom:2px;
}
.q-title{font-size:15px;font-weight:700;color:var(--ink-soft);margin-left:4px}
.q-prompt{margin:2px 0 0;font-size:clamp(18px,4.4vw,24px);font-weight:900;line-height:1.4}

/* ---- 地圖 + 目標拼圖框 ---- */
.stage{display:flex;align-items:center;gap:10px;margin-top:8px}
.map-wrap{flex:0 0 auto;height:clamp(180px,30dvh,300px);aspect-ratio:300/500}
.map-svg{width:100%;height:100%;display:block}
.pin{animation:pinBounce 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pinBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pin-pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}

.dropzone{
  position:relative;flex:1;align-self:stretch;
  min-height:150px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  text-align:center;padding:12px;
  border:4px dashed var(--orange);border-radius:20px;
  background:rgba(255,255,255,.55);
  animation:glow 1.6s ease-in-out infinite;
  transition:background .2s, transform .2s;
}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,138,61,.0), 0 0 14px 2px rgba(255,201,74,.55)}
  50%{box-shadow:0 0 0 6px rgba(255,138,61,.18), 0 0 28px 8px rgba(255,201,74,.9)}
}
.dropzone .dz-icon{font-size:40px;line-height:1;animation:float 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dropzone .dz-text{font-weight:900;font-size:clamp(16px,3.8vw,22px)}
.dropzone .dz-place{font-size:15px;color:var(--ink-soft);font-weight:700}
.dropzone.hover{background:#fff4c7;transform:scale(1.03);border-style:solid}
.dropzone.armed{background:#fff4c7}
.dropzone.shake{animation:shake .45s}
.dropzone.filled{border-style:solid;border-color:var(--green);background:#e6f8ec;animation:none;box-shadow:0 0 30px 6px rgba(63,174,106,.55)}
.dropzone.filled .dz-icon{animation:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* =========================================================
   4. 拼圖碎片區
   ========================================================= */
.pieces-title{margin:0 0 12px;font-size:clamp(17px,4vw,22px);font-weight:900;text-align:center}
.pieces-title small{display:block;font-size:14px;font-weight:700;color:var(--ink-soft)}
.pieces{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 16px;padding:12px 10px 4px}
.slot{position:relative;min-height:96px}
.piece{
  position:relative;width:100%;height:100%;min-height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:10px 12px;border:none;border-radius:16px;
  background:var(--pc,#ffd36e);color:var(--ink);
  font-size:clamp(15px,3.8vw,19px);font-weight:900;line-height:1.3;text-align:center;
  filter:drop-shadow(0 5px 0 rgba(74,52,32,.35));
  touch-action:none;            /* 避免拖曳時畫面捲動 */
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  cursor:grab;
  transition:transform .35s cubic-bezier(.3,1.5,.5,1), opacity .3s, filter .2s;
  will-change:transform;
}
/* 拼圖的凸起「卡榫」 */
.piece::before,.piece::after{
  content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--pc,#ffd36e);z-index:-1;
}
.piece::before{top:-12px;left:calc(50% - 13px)}
.piece::after{right:-12px;top:calc(50% - 13px)}
.piece .p-icon{font-size:30px;line-height:1.1}
.piece .p-sub{font-size:.78em;font-weight:700;color:var(--ink-soft)}
.piece:focus-visible{outline:4px solid var(--orange-dark);outline-offset:6px}
.piece.dragging{cursor:grabbing;z-index:1000;transition:none;filter:drop-shadow(0 14px 6px rgba(74,52,32,.35))}
.piece.selected{outline:4px solid var(--orange);outline-offset:5px;animation:wiggle .5s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.piece.wrong{animation:shake .45s}
.piece.tried{opacity:.45;filter:grayscale(1);cursor:not-allowed}
.piece.tried::marker{content:none}
.piece.tried .p-icon::after{content:" ❌";font-size:.6em}
.piece.flying{z-index:1000;pointer-events:none}
.piece.gone{opacity:0;pointer-events:none}

/* ---- 溫和提示 Toast ---- */
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translate(-50%,140%);
  width:min(92vw,560px);
  background:var(--white);border:3px solid var(--red);border-radius:18px;
  padding:12px 16px;box-shadow:var(--shadow);
  display:flex;gap:10px;align-items:flex-start;
  font-size:17px;font-weight:700;line-height:1.5;
  transition:transform .4s cubic-bezier(.3,1.4,.5,1);
  z-index:2000;pointer-events:none;
}
.toast.show{transform:translate(-50%,0)}
.toast .t-emoji{font-size:30px;line-height:1}
.toast b{color:var(--red)}

/* =========================================================
   5. 知識解鎖 Modal
   ========================================================= */
.overlay{
  position:fixed;inset:0;z-index:3000;
  display:flex;align-items:center;justify-content:center;
  padding:14px;background:rgba(43,26,10,.6);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.open{opacity:1;pointer-events:auto}
.modal{
  width:min(100%,680px);max-height:calc(100dvh - 28px);overflow:auto;
  background:var(--parchment);border:4px solid #8b5a2b;border-radius:26px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  padding:18px 18px 20px;
  transform:scale(.7) translateY(30px);transition:transform .45s cubic-bezier(.3,1.5,.5,1);
}
.overlay.open .modal{transform:scale(1) translateY(0)}
.modal-head{text-align:center}
.unlock-badge{
  display:inline-block;background:var(--green);color:var(--white);font-weight:900;
  padding:4px 16px;border-radius:99px;font-size:16px;letter-spacing:2px;
}
.modal h2{margin:8px 0 4px;font-size:clamp(22px,5.4vw,30px);font-weight:900}
.earned{font-weight:900;color:var(--orange-dark);font-size:18px}

.media-box{
  position:relative;margin:12px 0;border-radius:18px;overflow:hidden;
  aspect-ratio:16/9;background:#2b1a0a;border:3px solid var(--ink);
}
.media-el{width:100%;height:100%;object-fit:cover;display:block}
.media-placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--white);text-align:center;padding:12px;
  background:var(--ph-bg,linear-gradient(135deg,#2a8fbd,#3fae6a));
}
.media-placeholder .ph-scene{font-size:clamp(40px,11vw,64px);letter-spacing:6px;animation:float 2.4s ease-in-out infinite}
.media-placeholder .ph-label{
  font-weight:900;font-size:clamp(15px,3.8vw,19px);background:rgba(0,0,0,.35);
  padding:4px 14px;border-radius:99px;border:2px dashed rgba(255,255,255,.8);
}
.media-placeholder .ph-anchor{font-size:14px;font-weight:700;opacity:.95}
.media-placeholder details{font-size:13px;max-width:92%;text-align:left;background:rgba(0,0,0,.3);border-radius:10px;padding:4px 10px}
.media-placeholder summary{cursor:pointer;font-weight:700}

.reason{
  background:var(--white);border:3px solid var(--orange);border-radius:18px;padding:12px 16px;
}
.reason h3{margin:0 0 6px;font-size:20px;font-weight:900;color:var(--orange-dark)}
.reason p{margin:0;font-size:clamp(17px,4vw,19px);line-height:1.75}
.memo{
  margin-top:10px;background:#e6f8ec;border:2px dashed var(--green);border-radius:14px;
  padding:8px 12px;font-size:16px;font-weight:700;line-height:1.6;
}
.big-btn{
  display:block;width:100%;margin-top:14px;
  border:none;border-radius:18px;padding:16px;
  font-size:clamp(20px,5vw,24px);font-weight:900;color:var(--white);
  background:linear-gradient(180deg,var(--orange),var(--orange-dark));
  box-shadow:0 6px 0 #a8460c;
  transition:transform .1s, box-shadow .1s;
}
.big-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a8460c}
.big-btn.green{background:linear-gradient(180deg,#53c47f,var(--green-dark));box-shadow:0 6px 0 #1d6439}

/* ---- 開始 / 結算畫面 ---- */
.intro .modal,.result .modal{text-align:center}
.intro .mascot,.result .mascot{width:120px;height:120px;margin:0 auto}
.intro p{font-size:18px;line-height:1.7;margin:8px 0}
.stars{font-size:52px;letter-spacing:6px;margin:6px 0}
.final-score{font-size:34px;font-weight:900;color:var(--orange-dark)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.badges div{background:var(--white);border:2px solid var(--parchment-dark);border-radius:14px;padding:6px 2px;font-size:13px;font-weight:700;line-height:1.3}
.badges span{display:block;font-size:26px}

/* ---- 成功粒子 / 彩帶 ---- */
.spark{position:fixed;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:2500;animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(540deg) scale(.3);opacity:0}}

/* =========================================================
   6. RWD：電腦（≥1024px）左右對開
   ========================================================= */
@media (min-width:1024px){
  body{font-size:19px}
  .game{grid-template-columns:1.25fr 1fr;gap:18px;align-items:stretch}
  .panel{padding:20px}
  .mascot{width:110px;height:110px}
  .stage{flex-direction:row;gap:20px;margin-top:14px}
  .map-wrap{height:clamp(320px,56dvh,560px)}
  .dropzone{min-height:220px}
  .dropzone .dz-icon{font-size:56px}
  .pieces{grid-template-columns:1fr 1fr;gap:30px 22px;padding:16px 14px}
  .slot,.piece{min-height:140px}
  .piece{font-size:20px}
  .piece .p-icon{font-size:42px}
  .piece:hover:not(.tried):not(.dragging){transform:translateY(-4px) rotate(-1deg)}
}

/* 手機直式：壓縮高度，讓地圖、目標框、拼圖盡量在同一個畫面內 */
@media (max-width:640px) and (orientation:portrait){
  .app{padding:8px 8px 10px;gap:8px}
  .topbar{padding:8px 12px;gap:6px 10px}
  .topbar h1{font-size:19px;letter-spacing:0}
  .progress-wrap{flex:1 1 120px;gap:6px}
  .progress-label{font-size:15px}
  .score{font-size:16px;padding:3px 10px}
  .icon-btn{width:34px;height:34px;font-size:16px}
  .panel{padding:8px 10px}
  .mascot{width:58px;height:58px}
  .bubble{padding:6px 10px 8px}
  .q-prompt{font-size:18px}
  .stage{margin-top:4px}
  .map-wrap{height:clamp(150px,25dvh,250px)}
  .dropzone{min-height:120px;padding:8px}
  .dropzone .dz-icon{font-size:32px}
  .pieces-title{margin-bottom:2px;font-size:17px}
  .pieces-title small{font-size:13px}
  .pieces{gap:20px 14px;padding:12px 8px 2px}
  .slot,.piece{min-height:84px}
  .piece{font-size:16px;padding:6px 8px}
  .piece .p-icon{font-size:24px}
}

/* 手機橫式（高度矮）：也改為左右並排，避免需要捲動 */
@media (orientation:landscape) and (max-height:560px){
  body{font-size:16px}
  .app{padding:6px 10px 8px;gap:6px}
  .topbar{padding:6px 12px}
  .topbar h1{flex:1 1 auto;font-size:19px}
  .progress-wrap{flex:0 1 260px}
  .game{grid-template-columns:1.15fr 1fr;gap:10px}
  .panel{padding:8px}
  .mascot{width:54px;height:54px}
  .q-prompt{font-size:17px}
  .stage{margin-top:4px}
  .map-wrap{height:calc(100dvh - 210px);min-height:130px}
  .dropzone{min-height:110px}
  .dropzone .dz-icon{font-size:30px}
  .pieces-title{margin-bottom:4px;font-size:16px}
  .pieces{gap:18px 12px;padding:10px 10px 2px}
  .slot,.piece{min-height:70px}
  .piece{font-size:15px;padding:6px 8px}
  .piece .p-icon{font-size:22px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
}
</style>
</head>
<body>

</svg>

<div class="app">
  <!-- ===== 頂部資訊列 ===== -->

    reason:'阿美族是臺灣人口最多的原住民族，傳統上行母系社會，婚姻採招贅制；而部落中的男性則依照嚴格的年齡階級接受訓練，分工合作守護家園。',
    pin:{x:214, y:272, label:'花東縱谷'},
    media:'videos/kling_08_amis.mp4', // 請在此替換 Kling 生成的 MP4 或 GIF 網址
    scene:'💃🪶🕺🪶💃', bg:'linear-gradient(135deg,#b3202a,#ff7a59)',
    anchor:'牽手圓圈、羽毛頭冠與傳統舞蹈',
    kling:'盛大的集會場上，族人身穿鮮豔紅黑傳統服飾與羽毛頭飾，手牽手圍成圓圈踏步齊唱，節奏歡快。'
  }
];

const PIECE_COLORS = ['#ffd36e','#9fe0b5','#a9d3ff','#ffb3c1'];
const SCORE_BY_TRY = [100, 60, 30, 10];   // 第 1/2/3/4 次答對的得分

/* =========================================================
   B. 音效模組（Web Audio API 合成，免外部檔案）
   ========================================================= */
const Sound = (() => {
  let ctx = null, muted = false;
  const ensure = () => {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ctx = new AC(); }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(freq, start, dur, type = 'triangle', vol = .22) {
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  }
  return {
    unlock: ensure,
    toggle(){ muted = !muted; return muted; },
    pick(){ tone(660, 0, .08, 'sine', .15); },
    success(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .22, 'square', .1)); tone(1568, .38, .35, 'triangle', .14); },
    wrong(){ tone(330, 0, .18, 'sawtooth', .07); tone(247, .16, .28, 'sawtooth', .07); },
    fanfare(){ [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i * .13, .2, 'square', .09)); }
  };
})();

/* =========================================================
   C. 小工具
   ========================================================= */
const $ = id => document.getElementById(id);
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
function restartAnim(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* 以 Catmull-Rom 曲線把座標點平滑成臺灣輪廓 */
function smoothClosedPath(pts){
  const n = pts.length; let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n; i++){
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d + 'Z';
}
const TAIWAN_PTS = [[200,28],[216,36],[234,48],[250,64],[244,84],[238,102],[240,124],[233,152],[228,182],[222,214],[214,250],[206,286],[196,320],[186,354],[176,388],[168,420],[165,448],[160,472],[150,462],[146,440],[134,418],[118,396],[102,372],[90,348],[80,320],[72,290],[70,262],[76,236],[88,208],[102,180],[116,150],[130,122],[146,98],[162,74],[178,50]];

/* =========================================================
   D. 遊戲主程式
   ========================================================= */
const Game = {
  order: [], index: 0, score: 0, tries: 0, firstTry: 0, locked: false, selected: null,

  init(){
    $('taiwanPath').setAttribute('d', smoothClosedPath(TAIWAN_PTS));
    $('startBtn').addEventListener('click', () => { Sound.unlock(); Sound.pick(); closeOverlay('introOverlay'); this.start(); });
    $('nextBtn').addEventListener('click', () => { Sound.pick(); this.next(); });
    $('restartBtn').addEventListener('click', () => { Sound.pick(); closeOverlay('resultOverlay'); this.start(); });
    $('muteBtn').addEventListener('click', e => { const m = Sound.toggle(); e.currentTarget.textContent = m ? '🔇' : '🔊'; });
    const dz = $('dropzone');
    const tapZone = () => { if (this.selected) this.attempt(this.selected); };
    dz.addEventListener('click', tapZone);
    dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapZone(); } });
  },

  start(){
    // 題目依課本順序出題；若想隨機出題可改成 shuffle(QUESTIONS.map((_, i) => i))
    this.order = QUESTIONS.map((_, i) => i);
    this.index = 0; this.score = 0; this.firstTry = 0;
    $('scoreNum').textContent = 0;
    this.render();
  },

  get q(){ return QUESTIONS[this.order[this.index]]; },

  render(){
    const q = this.q, total = QUESTIONS.length;
    this.tries = 0; this.locked = false; this.selected = null;

    // 頂部進度
    $('progressLabel').textContent = `第 ${this.index + 1} / ${total} 關`;
    $('progressFill').style.width = `${(this.index / total) * 100}%`;
    $('progressBar').setAttribute('aria-valuenow', this.index);

    // 吉祥物提問
    $('unitTag').textContent = q.unit.split('：')[0];
    $('qTitle').textContent = q.title;
    $('qPrompt').textContent = `「${q.prompt}」`;

    // 目標框重置
    const dz = $('dropzone');
    dz.className = 'dropzone';
    $('dzIcon').textContent = '🧩';
    $('dzText').innerHTML = '把正確的拼圖<br>拖到這裡！';
    $('dzPlace').textContent = `📍 探險地點：${q.pin.label}`;

    this.renderPin(q.pin);
    this.renderPieces(q);
  },

  renderPin({x, y, label}){
    const w = label.length * 13 + 18;
    const lx = Math.min(Math.max(x, w / 2 + 4), 296 - w / 2);
    const ly = y - 46 < 8 ? y + 18 : y - 46;
    $('pinGroup').innerHTML = `
      <circle class="pin-pulse" cx="${x}" cy="${y}" r="10" fill="#ff8a3d"/>
      <g class="pin">
        <path d="M${x} ${y} C${x - 12} ${y - 14} ${x - 12} ${y - 30} ${x} ${y - 30} C${x + 12} ${y - 30} ${x + 12} ${y - 14} ${x} ${y}Z" fill="#e8565a" stroke="#fff" stroke-width="2.5"/>
        <circle cx="${x}" cy="${y - 20}" r="4.5" fill="#fff"/>
      </g>
      <rect x="${lx - w / 2}" y="${ly}" width="${w}" height="22" rx="11" fill="#4a3420" opacity=".9"/>
      <text x="${lx}" y="${ly + 16}" text-anchor="middle" font-size="13" font-weight="900" fill="#fffdf7">${label}</text>`;
  },

  renderPieces(q){
    const box = $('pieces'); box.innerHTML = '';
    const count = Math.random() < .5 ? 2 : 3;                       // 干擾項 2~3 個 → 總共 3~4 塊
    const ids = shuffle([q.answer, ...shuffle(q.distractors).slice(0, count)]);
    ids.forEach((id, i) => {
      const p = PIECES[id];
      const slot = document.createElement('div'); slot.className = 'slot';
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'piece'; el.dataset.id = id;
      el.style.setProperty('--pc', PIECE_COLORS[i % PIECE_COLORS.length]);
      el.setAttribute('aria-label', `拼圖：${p.text}，${p.sub}`);
      el.innerHTML = `<span class="p-icon">${p.icon}</span><span>${p.text}</span><span class="p-sub">${p.sub}</span>`;
      Drag.bind(el);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.attempt(el); } });
      slot.appendChild(el); box.appendChild(slot);
    });
  },

  select(el){
    if (this.selected) this.selected.classList.remove('selected');
    if (this.selected === el) { this.selected = null; $('dropzone').classList.remove('armed'); return; }
    this.selected = el; el.classList.add('selected'); $('dropzone').classList.add('armed');
  },

  /* 點選/鍵盤：讓拼圖飛到目標框再判斷 */
  async attempt(el){
    if (this.locked || el.classList.contains('tried')) return;
    el.classList.remove('selected'); this.selected = null; $('dropzone').classList.remove('armed');
    this.locked = true;
    el.classList.add('flying');
    const off = Drag.offsetToZone(el, 0, 0);
    el.style.transform = `translate(${off.x}px, ${off.y}px) scale(.95)`;
    await wait(380);
    el.classList.remove('flying');
    this.locked = false;
    this.judge(el, off);
  },

  /* 判斷對錯；off = 拼圖目前相對原位的位移 */
  judge(el, off){
    const q = this.q, id = el.dataset.id;
    if (this.locked) return;
    this.tries++;
    if (id === q.answer) this.onCorrect(el, off);
    else this.onWrong(el);
  },

  async onCorrect(el, off){
    this.locked = true;
    const gained = SCORE_BY_TRY[Math.min(this.tries - 1, SCORE_BY_TRY.length - 1)];
    if (this.tries === 1) this.firstTry++;
    this.score += gained;

    // 吸附動畫：拼圖滑進框框中心
    const snap = Drag.offsetToZone(el, 0, 0);
    el.style.transition = 'transform .3s cubic-bezier(.3,1.6,.5,1)';
    el.style.transform = `translate(${snap.x}px, ${snap.y}px) scale(1.08)`;
    Sound.success();
    restartAnim($('mascot'), 'happy');
    hideToast();
    await wait(300);

    const p = PIECES[el.dataset.id];
    const dz = $('dropzone');
    dz.classList.add('filled');
    $('dzIcon').textContent = p.icon;
    $('dzText').innerHTML = `${p.text}<br><small style="font-size:.75em">${p.sub}</small>`;
    el.classList.add('gone');
    burst(dz);
    $('scoreNum').textContent = this.score;
    restartAnim($('score'), 'bump');
    $('progressFill').style.width = `${((this.index + 1) / QUESTIONS.length) * 100}%`;

    await wait(650);
    this.openUnlock(gained);
  },

  onWrong(el){
    Sound.wrong();
    el.style.transition = '';
    el.style.transform = '';                  // 彈回原位（CSS transition 產生回彈）
    el.classList.add('tried');
    el.setAttribute('aria-disabled', 'true');
    restartAnim(el, 'wrong');
    restartAnim($('dropzone'), 'shake');
    restartAnim($('mascot'), 'sad');
    const p = PIECES[el.dataset.id];
    showToast(`<b>再想想看喔！</b>這個特色屬於別的地方～<br>${p.hint}`);
  },

  openUnlock(gained){
    const q = this.q, p = PIECES[q.answer];
    $('unlockTitle').textContent = `${p.icon} ${p.text}`;
    $('earned').textContent = this.tries === 1 ? `一次就答對！+${gained} 分 🎯` : `答對了！+${gained} 分`;
    $('reasonText').textContent = q.reason;
    $('memoText').innerHTML = `🔑 <b>畫面記憶點：</b>${q.anchor}`;
    Media.show(q, this.order[this.index] + 1);
    $('nextBtn').textContent = this.index === QUESTIONS.length - 1 ? '看我的探險成績 🏆' : '下一題 ➜';
    openOverlay('unlockOverlay');
    $('nextBtn').focus({preventScroll:true});
  },

  next(){
    Media.stop();
    closeOverlay('unlockOverlay');
    if (this.index < QUESTIONS.length - 1) { this.index++; this.render(); }
    else this.finish();
  },

  finish(){
    const total = QUESTIONS.length;
    const stars = this.firstTry >= 7 ? 3 : this.firstTry >= 5 ? 2 : 1;
    $('stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    $('finalScore').textContent = `${this.score} / ${total * 100} 分`;
    $('resultMsg').textContent = [
      '', '探險完成！再玩一次，一定能拿更多星星！',
      '好厲害！你已經是小小探險家了！',
      '太神啦！你是臺灣知識大師，期中考穩穩der！'
    ][stars] + `（一次答對 ${this.firstTry} 題）`;
    $('badges').innerHTML = QUESTIONS.map(q => { const p = PIECES[q.answer]; return `<div><span>${p.icon}</span>${p.text}</div>`; }).join('');
    Sound.fanfare();
    openOverlay('resultOverlay');
    for (let i = 0; i < 4; i++) setTimeout(() => burst(document.body, 40), i * 300);
  }
};

/* =========================================================
   E. 拖曳模組（Pointer Events：同時支援滑鼠與手機觸控）
   ========================================================= */
const Drag = {
  cur: null,

  bind(el){
    el.addEventListener('pointerdown', e => this.down(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.up(e));
    el.addEventListener('pointercancel', e => this.cancel(e));
    // 舊版行動瀏覽器保險：阻止觸控預設捲動
    el.addEventListener('touchstart', e => { if (!el.classList.contains('tried')) e.preventDefault(); }, {passive:false});
  },

  down(e){
    const el = e.currentTarget;
    if (Game.locked || el.classList.contains('tried') || this.cur) return;
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    this.cur = {el, pid:e.pointerId, sx:e.clientX, sy:e.clientY, dx:0, dy:0, moved:false};
    Sound.unlock();
  },

  move(e){
    const c = this.cur; if (!c || e.pointerId !== c.pid) return;
    c.dx = e.clientX - c.sx; c.dy = e.clientY - c.sy;
    if (!c.moved && Math.hypot(c.dx, c.dy) > 8) {
      c.moved = true;
      c.el.classList.remove('selected'); Game.selected = null; $('dropzone').classList.remove('armed');
      c.el.classList.add('dragging');
      Sound.pick();
    }
    if (c.moved) {
      c.el.style.transform = `translate(${c.dx}px, ${c.dy}px) scale(1.06) rotate(-2deg)`;
      $('dropzone').classList.toggle('hover', this.overZone(c.el));
    }
  },

  up(e){
    const c = this.cur; if (!c || e.pointerId !== c.pid) return;
    this.cur = null;
    const el = c.el;
    el.classList.remove('dragging');
    $('dropzone').classList.remove('hover');
    if (!c.moved) { Sound.pick(); Game.select(el); return; }   // 只是點一下 → 選取
    if (this.overZone(el)) Game.judge(el, {x:c.dx, y:c.dy});
    else { el.style.transform = ''; }                          // 沒放進框 → 彈回
  },

  cancel(e){
    const c = this.cur; if (!c || e.pointerId !== c.pid) return;
    this.cur = null;
    c.el.classList.remove('dragging'); c.el.style.transform = '';
    $('dropzone').classList.remove('hover');
  },

  /* 拼圖中心點是否落在目標框（外擴 24px，讓小朋友更好放） */
  overZone(el){
    const r = el.getBoundingClientRect(), z = $('dropzone').getBoundingClientRect(), pad = 24;
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    return cx > z.left - pad && cx < z.right + pad && cy > z.top - pad && cy < z.bottom + pad;
  },

  /* 計算拼圖「原位中心」到目標框中心的位移 */
  offsetToZone(el){
    const prev = el.style.transform, prevT = el.style.transition;
    el.style.transition = 'none'; el.style.transform = 'none';
    const r = el.getBoundingClientRect();
    el.style.transform = prev; void el.offsetWidth; el.style.transition = prevT;
    const z = $('dropzone').getBoundingClientRect();
    return {x:(z.left + z.width / 2) - (r.left + r.width / 2), y:(z.top + z.height / 2) - (r.top + r.height / 2)};
  }
};

/* =========================================================
   F. 媒體模組（Kling 影片 / GIF / 預留位置）
   ========================================================= */
const Media = {
  show(q, no){
    const v = $('mediaVideo'), img = $('mediaImg'), ph = $('mediaPlaceholder');
    v.hidden = img.hidden = true; ph.hidden = false;
    ph.style.setProperty('--ph-bg', q.bg);
    $('phScene').textContent = q.scene;
    $('phLabel').textContent = `🎬 Kling 動畫預留位置 #${no}`;
    $('phAnchor').textContent = `記憶錨點：${q.anchor}`;
    $('phPrompt').textContent = q.kling;

    const src = (q.media || '').trim();
    if (!src) return;
    if (/\.(mp4|webm|mov)(\?|$)/i.test(src)) {
      v.onerror = () => { v.hidden = true; ph.hidden = false; };
      v.src = src; v.hidden = false; ph.hidden = true;
      v.play().catch(() => {});
    } else {
      img.onerror = () => { img.hidden = true; ph.hidden = false; };
      img.alt = `${q.title} 動畫`;
      img.src = src; img.hidden = false; ph.hidden = true;
    }
  },
  stop(){ const v = $('mediaVideo'); v.pause(); v.removeAttribute('src'); v.load(); }
};

/* =========================================================
   G. 介面小元件：Modal、提示、粒子
   ========================================================= */
function openOverlay(oid){ $(oid).classList.add('open'); }
function closeOverlay(oid){ $(oid).classList.remove('open'); }

let toastTimer = null;
function showToast(html){
  $('toastText').innerHTML = html;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 3600);
}
function hideToast(){ $('toast').classList.remove('show'); }

function burst(target, n = 26){
  const r = target.getBoundingClientRect();
  const colors = ['#ffc94a', '#ff8a3d', '#3fae6a', '#5fb7d4', '#e8565a', '#b98cff'];
  for (let i = 0; i < n; i++){
    const s = document.createElement('div'); s.className = 'spark';
    const x = target === document.body ? Math.random() * innerWidth : r.left + r.width / 2;
    const y = target === document.body ? -10 : r.top + r.height / 2;
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 120;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.background = colors[i % colors.length];
    s.style.setProperty('--dx', (target === document.body ? (Math.random() - .5) * 120 : Math.cos(ang) * dist) + 'px');
    s.style.setProperty('--dy', (target === document.body ? innerHeight * (.6 + Math.random() * .5) : Math.sin(ang) * dist) + 'px');
    if (target === document.body) s.style.animationDuration = (1.6 + Math.random()) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2800);
  }
}

Game.init();
