<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>石虎探險家・臺灣拼圖大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. 色彩與基礎設定
   ========================================================= */
:root{
  --parchment:#fbefd0;
  --parchment-dark:#f0d9a4;
  --ink:#4a3420;
  --ink-soft:#7a5a3a;
  --orange:#ff8a3d;
  --orange-dark:#e5671a;
  --green:#3fae6a;
  --green-dark:#2b8a50;
  --gold:#ffc94a;
  --red:#e8565a;
  --white:#fffdf7;
  --shadow:0 6px 0 rgba(74,52,32,.18), 0 10px 24px rgba(74,52,32,.18);
  --radius:22px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;
  font-size:18px;font-weight:500;color:var(--ink);
  background-color:#e9cf93;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.35) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.25) 0 2px, transparent 3px),
    radial-gradient(ellipse at 50% 0%, #f7e2ad 0%, #e9cf93 70%);
  background-size:60px 60px, 90px 90px, 100% 100%;
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;gap:8px;max-width:1500px;min-height:100dvh;margin:0 auto;padding:8px 10px 10px}

/* =========================================================
   2. 頂部資訊列
   ========================================================= */
.topbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;
  background:linear-gradient(180deg,#8b5a2b,#6e4520);color:var(--white);
  border-radius:var(--radius);padding:8px 14px;box-shadow:var(--shadow);border:3px solid #4a2e14;
}
.topbar h1{flex:1 1 100%;margin:0;font-size:clamp(18px,4.4vw,28px);font-weight:900;text-shadow:0 3px 0 #3b220c}
.progress-wrap{flex:1 1 140px;display:flex;align-items:center;gap:8px}
.progress-label{font-weight:900;white-space:nowrap;font-size:16px}
.progress{flex:1;height:16px;border-radius:99px;background:#3b220c;overflow:hidden;border:2px solid #f5d38a}
.progress-fill{height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(45deg,var(--gold) 0 12px,#ffdf85 12px 24px);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.score{display:flex;align-items:center;gap:6px;background:var(--gold);color:var(--ink);font-weight:900;padding:3px 12px;border-radius:99px;font-size:17px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.score.bump{animation:bump .5s}
.icon-btn{border:none;background:rgba(255,255,255,.18);color:var(--white);width:38px;height:38px;border-radius:50%;font-size:18px}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}}
@media (min-width:700px){.topbar h1{flex:1 1 auto}.progress-wrap{flex:0 1 320px}}

/* =========================================================
   3. 主遊戲區（預設：手機直式上下排列）
   ========================================================= */
.game{
  flex:1;display:grid;gap:8px;align-content:start;
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"guide" "map" "pieces";
  --mapH:clamp(300px, 52dvh, 640px);
}
.panel{position:relative;background:var(--parchment);border-radius:var(--radius);border:3px solid #c79a55;box-shadow:var(--shadow);padding:10px}
.panel::before{content:"";position:absolute;inset:5px;border:2px dashed rgba(122,90,58,.35);border-radius:calc(var(--radius) - 5px);pointer-events:none}

/* ---- 吉祥物對話框 ---- */
.guide{grid-area:guide;display:flex;align-items:flex-end;gap:8px;z-index:2}
.mascot{width:62px;height:62px;flex:0 0 auto;filter:drop-shadow(0 3px 0 rgba(74,52,32,.25))}
.mascot.happy{animation:hop .6s}
.mascot.sad{animation:tilt .6s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
.bubble{position:relative;flex:1;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:6px 12px 8px;margin-bottom:4px}
.bubble::before{content:"";position:absolute;left:-14px;bottom:14px;border-width:9px 14px 9px 0;border-style:solid;border-color:transparent var(--ink) transparent transparent}
.bubble::after{content:"";position:absolute;left:-9px;bottom:16px;border-width:7px 11px 7px 0;border-style:solid;border-color:transparent var(--white) transparent transparent}
.unit-tag{display:inline-block;font-size:13px;font-weight:900;color:var(--white);background:var(--green);border-radius:99px;padding:1px 10px}
.unit-tag.u2{background:#8a5cc7}
.q-title{font-size:14px;font-weight:700;color:var(--ink-soft);margin-left:4px}
.q-prompt{margin:2px 0 0;font-size:clamp(17px,4.2vw,22px);font-weight:900;line-height:1.4}
.q-target{margin-top:3px;font-size:14px;font-weight:700;color:var(--orange-dark)}

/* ---- 大地圖 ---- */
.map-panel{grid-area:map;z-index:1;padding:8px;display:flex;justify-content:center;align-items:center}
.map-wrap{
  position:relative;aspect-ratio:3/4;
  width:min(100%, calc(var(--mapH) * .75));
  border-radius:16px;overflow:hidden;border:3px solid #8b5a2b;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
  background:#9fdcec;
}
.map-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
.map-svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 地圖上的插槽（SVG） */
.slot .slot-shape{fill:rgba(255,255,255,.4);stroke:var(--orange);stroke-width:7;stroke-dasharray:20 12;animation:march 1s linear infinite}
.slot.target{filter:drop-shadow(0 0 7px rgba(255,170,40,.95));cursor:pointer}
.slot.target .slot-shape{animation:march 1s linear infinite, pulseW 1.4s ease-in-out infinite}
.slot .slot-q{font-size:56px;font-weight:900;fill:var(--orange-dark);text-anchor:middle;pointer-events:none}
.slot.hover .slot-shape,.slot.armed .slot-shape{fill:rgba(255,244,199,.9)}
.slot.hover{transform-box:fill-box;transform-origin:center}
.slot.shake{animation:svgShake .45s}
.slot.filled{animation:none;filter:drop-shadow(0 0 10px rgba(255,214,90,.95))}
.slot.filled .slot-shape{stroke:var(--green);stroke-dasharray:none;fill:rgba(230,248,236,.92);animation:none}
.slot.filled .slot-q{display:none}
.slot .slot-icon{font-size:62px;text-anchor:middle;dominant-baseline:central;animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
.slot.decoy .slot-shape{fill:rgba(255,255,255,.22);stroke:rgba(255,255,255,.85);stroke-width:4;stroke-dasharray:12 10;animation:none}
.slot-label rect{fill:rgba(74,52,32,.92);stroke:#fff;stroke-width:3}
.slot-label text{font-size:30px;font-weight:900;fill:#fffdf7;text-anchor:middle}
.slot-label.gold rect{fill:#c98a10}
.slot-label{animation:popIn .45s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
.belt-track{stroke:#fff;stroke-width:12;stroke-dasharray:24 14;stroke-linecap:round;animation:march 1s linear infinite;opacity:.95}
.slot.filled .belt-track{stroke:#ffc94a;stroke-dasharray:none;stroke-width:16;animation:none}
.meridian{stroke:rgba(255,255,255,.9);stroke-width:4;stroke-dasharray:14 12}
.pit-dirt{fill:rgba(122,74,34,.85);stroke:#5a3412;stroke-width:4}
.pit-hole{fill:#3b220c}
.totem-band{stroke:#7a5a3a;stroke-width:5;opacity:.75}
.slot.filled .totem-body{fill:url(#totemGrad)}
.slot.filled .totem-band{stroke:#fff3c4;opacity:1}
.arrow{fill:#e8565a;stroke:#fff;stroke-width:4;animation:push 1.2s ease-in-out infinite;transform-box:fill-box}
.arrow.r{animation-name:pushR}
.hint-text{font-size:28px;font-weight:900;fill:#fff;paint-order:stroke;stroke:#3b220c;stroke-width:6;text-anchor:middle}
@keyframes march{to{stroke-dashoffset:-32}}
@keyframes pulseW{0%,100%{stroke-width:6}50%{stroke-width:11}}
@keyframes svgShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@keyframes popIn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes push{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@keyframes pushR{0%,100%{transform:translateX(0)}50%{transform:translateX(-18px)}}
.slot .slot-icon,.slot-label{transform-box:fill-box;transform-origin:center}

/* =========================================================
   4. 拼圖碎片區
   ========================================================= */
.pieces-panel{grid-area:pieces;z-index:5}
.pieces-title{margin:0 0 4px;font-size:16px;font-weight:900;text-align:center}
.pieces-title small{display:block;font-size:13px;font-weight:700;color:var(--ink-soft)}
.pieces{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;padding:12px 8px 2px}
.slot-cell{position:relative;min-height:70px}
.piece{
  position:relative;width:100%;height:100%;min-height:70px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:6px 10px;border:none;border-radius:14px;
  background:var(--pc,#ffd36e);color:var(--ink);
  font-size:clamp(14px,3.6vw,18px);font-weight:900;line-height:1.25;text-align:center;
  filter:drop-shadow(0 4px 0 rgba(74,52,32,.35));
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  cursor:grab;transition:transform .35s cubic-bezier(.3,1.5,.5,1), opacity .3s, filter .2s;will-change:transform;
}
.piece::before,.piece::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--pc,#ffd36e);z-index:-1}
.piece::before{top:-10px;left:calc(50% - 11px)}
.piece::after{right:-10px;top:calc(50% - 11px)}
.piece .p-icon{font-size:22px;line-height:1.1}
.piece .p-sub{font-size:.76em;font-weight:700;color:var(--ink-soft)}
.piece:focus-visible{outline:4px solid var(--orange-dark);outline-offset:6px}
.piece.dragging{cursor:grabbing;z-index:1000;transition:none;filter:drop-shadow(0 14px 6px rgba(74,52,32,.35))}
.piece.selected{outline:4px solid var(--orange);outline-offset:5px;animation:wiggle .5s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.piece.wrong{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.piece.tried{opacity:.45;filter:grayscale(1);cursor:not-allowed}
.piece.tried .p-icon::after{content:" ❌";font-size:.6em}
.piece.flying{z-index:1000;pointer-events:none}
.piece.gone{opacity:0;pointer-events:none}

/* ---- 溫和提示 Toast ---- */
.toast{
  position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,160%);
  width:min(92vw,560px);background:var(--white);border:3px solid var(--red);border-radius:18px;
  padding:10px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;
  font-size:16px;font-weight:700;line-height:1.5;transition:transform .4s cubic-bezier(.3,1.4,.5,1);z-index:2000;pointer-events:none;
}
.toast.show{transform:translate(-50%,0)}
.toast .t-emoji{font-size:28px;line-height:1}
.toast b{color:var(--red)}

/* =========================================================
   5. 知識解鎖 Modal
   ========================================================= */
.overlay{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(43,26,10,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:auto}
.modal{
  width:min(100%,700px);max-height:calc(100dvh - 24px);overflow:auto;
  background:var(--parchment);border:4px solid #8b5a2b;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.4);
  padding:16px 16px 18px;transform:scale(.7) translateY(30px);transition:transform .45s cubic-bezier(.3,1.5,.5,1);
}
.overlay.open .modal{transform:scale(1) translateY(0)}
.modal-head{text-align:center}
.unlock-badge{display:inline-block;background:var(--green);color:var(--white);font-weight:900;padding:4px 16px;border-radius:99px;font-size:15px;letter-spacing:2px}
.modal h2{margin:6px 0 2px;font-size:clamp(21px,5.2vw,28px);font-weight:900}
.earned{font-weight:900;color:var(--orange-dark);font-size:17px}
.media-box{position:relative;margin:10px 0;border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:#2b1a0a;border:3px solid var(--ink)}
.media-el{width:100%;height:100%;object-fit:cover;display:block}
.media-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--white);text-align:center;padding:12px;background:var(--ph-bg,linear-gradient(135deg,#2a8fbd,#3fae6a))}
.media-placeholder .ph-scene{font-size:clamp(38px,10vw,60px);letter-spacing:6px;animation:float 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.media-placeholder .ph-label{font-weight:900;font-size:clamp(15px,3.8vw,18px);background:rgba(0,0,0,.35);padding:4px 14px;border-radius:99px;border:2px dashed rgba(255,255,255,.8)}
.media-placeholder details{font-size:13px;max-width:92%;text-align:left;background:rgba(0,0,0,.3);border-radius:10px;padding:4px 10px}
.media-placeholder summary{cursor:pointer;font-weight:700}
.tip{border-radius:18px;padding:10px 14px;margin-top:10px}
.tip h3{margin:0 0 4px;font-size:19px;font-weight:900}
.tip p{margin:0;font-size:clamp(16px,3.9vw,18px);line-height:1.75}
.tip.mnemonic{background:#fff6d6;border:3px solid var(--gold)}
.tip.mnemonic h3{color:#b07800}
.tip.mnemonic p{font-weight:900;font-size:clamp(17px,4.2vw,20px)}
.tip.exam{background:var(--white);border:3px solid var(--orange)}
.tip.exam h3{color:var(--orange-dark)}
.tip.exam b{color:#c2410c}
.big-btn{display:block;width:100%;margin-top:14px;border:none;border-radius:18px;padding:15px;font-size:clamp(19px,5vw,23px);font-weight:900;color:var(--white);background:linear-gradient(180deg,var(--orange),var(--orange-dark));box-shadow:0 6px 0 #a8460c;transition:transform .1s, box-shadow .1s}
.big-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a8460c}
.big-btn.green{background:linear-gradient(180deg,#53c47f,var(--green-dark));box-shadow:0 6px 0 #1d6439}

/* ---- 開始 / 結算畫面 ---- */
.intro .modal,.result .modal{text-align:center}
.intro .mascot,.result .mascot{width:110px;height:110px;margin:0 auto}
.intro p{font-size:17px;line-height:1.7;margin:8px 0}
.stars{font-size:48px;letter-spacing:6px;margin:4px 0}
.final-score{font-size:32px;font-weight:900;color:var(--orange-dark)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.badges div{background:var(--white);border:2px solid var(--parchment-dark);border-radius:12px;padding:4px 2px;font-size:12px;font-weight:700;line-height:1.3}
.badges span{display:block;font-size:22px}
@media (min-width:600px){.badges{grid-template-columns:repeat(6,1fr)}}

/* ---- 結算：弱項診斷與急救包 ---- */
.result .modal.result-modal{width:min(100%,900px);text-align:left}
.result-modal h2{text-align:center}
.result-top{display:grid;grid-template-columns:1fr;gap:10px;align-items:center;margin:6px 0 10px}
@media (min-width:640px){.result-top{grid-template-columns:200px 1fr}}
.score-box{text-align:center;background:var(--white);border:3px solid var(--gold);border-radius:18px;padding:6px}
.score-box .stars{font-size:34px;margin:0}
.score-box .final-score{font-size:26px}
.first-try{font-size:14px;font-weight:700;color:var(--ink-soft)}
.err-stats{display:flex;flex-direction:column;gap:6px;background:var(--white);border:3px solid var(--parchment-dark);border-radius:18px;padding:10px 12px}
.err-row{display:grid;grid-template-columns:8.6em 1fr 3.2em;align-items:center;gap:8px;font-size:15px;font-weight:700}
.err-bar{height:14px;border-radius:99px;background:#efe3c4;overflow:hidden}
.err-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffb36b,#e8565a);transition:width .8s cubic-bezier(.3,1.2,.5,1)}
.err-row.weak{color:var(--red)}
.err-row b{text-align:right}
.diagnose{display:flex;align-items:flex-end;gap:8px;margin-bottom:6px}
.diagnose .mascot{width:72px;height:72px;flex:0 0 auto}
.diagnose .bubble p{margin:0;font-size:clamp(16px,4vw,19px);font-weight:900;line-height:1.6}
.diagnose .bubble b{color:var(--red)}
.kit-heading{margin:10px 0 6px;font-size:20px;font-weight:900}
.kit-tabs{display:flex;gap:6px;flex-wrap:wrap}
.kit-tab{flex:1 1 140px;border:3px solid #c79a55;background:var(--parchment-dark);color:var(--ink);border-radius:16px 16px 0 0;padding:8px 6px;font-size:16px;font-weight:900;position:relative}
.kit-tab[aria-selected="true"]{background:var(--white);border-bottom-color:var(--white);color:var(--orange-dark)}
.kit-tab .weak-dot{position:absolute;top:-10px;right:6px;background:var(--red);color:#fff;font-size:12px;border-radius:99px;padding:1px 8px}
.kit-panel{background:var(--white);border:3px solid #c79a55;border-radius:0 0 18px 18px;padding:12px;margin-top:-3px}
.kit-intro{font-size:18px;font-weight:900;margin:8px 0;line-height:1.6}
.infographic-box{position:relative;border-radius:16px;overflow:hidden;border:3px solid var(--ink);aspect-ratio:4/3;background:linear-gradient(135deg,#f7e2ad,#e9cf93)}
.infographic-img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.infographic-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:900;color:var(--ink-soft);padding:12px}
.infographic-ph span{font-size:48px}
.kit-cards{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media (min-width:700px){.kit-cards{grid-template-columns:1fr 1fr}}
.kit-card{background:#fffaf0;border:2px solid var(--parchment-dark);border-left:8px solid var(--kc,#ffc94a);border-radius:14px;padding:10px 12px}
.kit-card h4{margin:0 0 4px;font-size:18px;font-weight:900}
.kit-card p,.kit-card li{margin:0;font-size:16px;line-height:1.7}
.kit-card ul{margin:4px 0 0;padding-left:1.2em}
.kit-card b{color:#c2410c}
.kit-mnemonic{margin-top:10px;background:#fff6d6;border:3px dashed var(--gold);border-radius:16px;padding:10px 14px}
.kit-mnemonic h4{margin:0 0 4px;color:#b07800;font-size:18px;font-weight:900}
.kit-mnemonic p{margin:0;font-size:18px;font-weight:900;line-height:1.7}
.badge-wrap{margin-top:10px}
.badge-wrap summary{cursor:pointer;font-weight:900;font-size:16px}

.spark{position:fixed;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:2500;animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(540deg) scale(.3);opacity:0}}

/* =========================================================
   6. RWD
   ========================================================= */
/* 電腦（≥1024px）：左邊大地圖、右邊提問與拼圖 */
@media (min-width:1024px){
  .app{padding:10px 16px 14px;gap:10px}
  .game{
    grid-template-columns:auto minmax(360px,1fr);
    grid-template-rows:auto 1fr;
    grid-template-areas:"map guide" "map pieces";
    gap:14px;align-items:start;
    --mapH:calc(100dvh - 130px);
  }
  .map-panel{align-self:stretch}
  .map-wrap{width:min(calc(var(--mapH) * .75), 60vw)}
  .mascot{width:96px;height:96px}
  .q-prompt{font-size:24px}
  .q-target{font-size:16px}
  .pieces-title{font-size:19px}
  .pieces{gap:26px 20px;padding:16px 12px 6px}
  .slot-cell,.piece{min-height:96px}
  .piece{font-size:19px}
  .piece .p-icon{font-size:30px}
  .piece:hover:not(.tried):not(.dragging){transform:translateY(-4px) rotate(-1deg)}
}
/* 手機與平板直式：整頁剛好一個畫面，地圖自動填滿剩下的空間 */
@media (max-width:1023px) and (orientation:portrait){
  .app{height:100dvh;min-height:0}
  .game{display:flex;flex-direction:column;min-height:0}
  .map-panel{flex:1 1 0;min-height:220px;container-type:size;padding:6px}
  .map-wrap{width:min(100cqw, 75cqh)}

/* 弱項診斷：每拖錯一次，該題分類 +1 */

const PIECE_COLORS = ['#ffd36e','#9fe0b5','#a9d3ff','#ffb3c1'];

/* =========================================================
   C. 地圖座標：經緯度 → 地圖 SVG 座標（底圖範圍 118.85°E～122.70°E、21.30°N～26.00°N）
   ========================================================= */
const MAP = {w:1000, h:1333, lon0:118.85, lon1:122.70, lat0:21.30, lat1:26.00};
const P = (lon, lat) => [ (lon - MAP.lon0) / (MAP.lon1 - MAP.lon0) * MAP.w, (MAP.lat1 - lat) / (MAP.lat1 - MAP.lat0) * MAP.h ];
const OCEAN = {  // 四方海浪插槽位置
  N:{lon:121.15, lat:25.72, w:240, h:96},
  E:{lon:122.35, lat:23.55, w:130, h:220},
  S:{lon:120.55, lat:21.56, w:240, h:96},
  W:{lon:119.55, lat:24.55, w:150, h:220}
};

/* =========================================================
   D. 音效（Web Audio API 合成）
   ========================================================= */
const Sound = (() => {
  let ctx = null, muted = false;
  const ensure = () => {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ctx = new AC(); }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(freq, start, dur, type = 'triangle', vol = .22){
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  }
  return {
    unlock: ensure,
    toggle(){ muted = !muted; return muted; },
    isMuted(){ return muted; },
    pick(){ tone(660, 0, .08, 'sine', .15); },
    success(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .22, 'square', .1)); tone(1568, .38, .35, 'triangle', .14); },
    wrong(){ tone(330, 0, .18, 'sawtooth', .07); tone(247, .16, .28, 'sawtooth', .07); },
    fanfare(){ [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i * .13, .2, 'square', .09)); }
  };
})();

/* =========================================================
   E. 小工具
   ========================================================= */
const $ = id => document.getElementById(id);
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
function restartAnim(el, cls){ el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }
const emphasize = s => s.replace(/【(.+?)】/g, '<b>【$1】</b>');
function label(x, y, text, cls = ''){
  const w = [...text].reduce((n, ch) => n + (ch.charCodeAt(0) > 255 ? 30 : 17), 0) + 36;
  const lx = clamp(x, w / 2 + 8, MAP.w - 8 - w / 2);
  return `<g class="slot-label ${cls}"><rect x="${lx - w / 2}" y="${y - 28}" width="${w}" height="50" rx="25"/><text x="${lx}" y="${y + 7}">${text}</text></g>`;
}

/* =========================================================
   F. 地圖插槽繪製（每種題型一種外觀）
   ========================================================= */
const Slots = {
  render(q){
    const s = q.slot; let html = '';
    if (s.type === 'core'){
      const [x, y] = P(s.lon, s.lat);
      html = `
        <path class="arrow" d="M${x - 250} ${y - 22} h70 v-22 l46 44 l-46 44 v-22 h-70z"/>
        <path class="arrow r" d="M${x + 250} ${y - 22} h-70 v-22 l-46 44 l46 44 v-22 h70z"/>
        <g id="slotTarget" class="slot target" data-x="${x}" data-y="${y}">
          <circle class="slot-shape" cx="${x}" cy="${y}" r="78"/><text class="slot-q" x="${x}" y="${y + 20}">?</text>
        </g>`;
    }
    if (s.type === 'terrain'){
      const [x, y] = P(s.lon, s.lat);
      html = `<g id="slotTarget" class="slot target" data-x="${x}" data-y="${y}">
          <rect class="slot-shape" x="${x - 85}" y="${y - 58}" width="170" height="116" rx="26"/>
          <text class="slot-q" x="${x}" y="${y + 20}">?</text></g>`;
    }
    if (s.type === 'arch'){
      const [x, y] = P(s.lon, s.lat);
      html = `<g id="slotTarget" class="slot target" data-x="${x}" data-y="${y}">
          <ellipse class="pit-dirt" cx="${x}" cy="${y}" rx="78" ry="50"/>
          <ellipse class="pit-hole" cx="${x}" cy="${y + 4}" rx="50" ry="28"/>
          <ellipse class="slot-shape" cx="${x}" cy="${y}" rx="92" ry="62" style="fill:none"/>
          <text class="slot-q" x="${x}" y="${y + 18}" style="fill:#ffc94a">?</text></g>`;
    }
    if (s.type === 'tribe'){
      const [x, y] = P(s.lon, s.lat), top = y - 110;
      html = `<g id="slotTarget" class="slot target" data-x="${x}" data-y="${y - 40}">
          <path class="slot-shape totem-body" d="M${x - 36} ${y + 20} V${top + 30} L${x} ${top} L${x + 36} ${top + 30} V${y + 20} Z"/>
          <line class="totem-band" x1="${x - 32}" y1="${top + 55}" x2="${x + 32}" y2="${top + 55}"/>
          <line class="totem-band" x1="${x - 32}" y1="${top + 90}" x2="${x + 32}" y2="${top + 90}"/>
          <line class="totem-band" x1="${x - 32}" y1="${top + 120}" x2="${x + 32}" y2="${top + 120}"/>
          <text class="slot-q" x="${x}" y="${y - 22}">?</text></g>`;
    }
    if (s.type === 'belt'){
      const [x1, y] = P(119.95, s.lat), [x2] = P(121.85, s.lat), cx = (x1 + x2) / 2;
      html = `<g id="slotTarget" class="slot target" data-x="${cx}" data-y="${y}">
          <rect x="${x1 - 20}" y="${y - 50}" width="${x2 - x1 + 40}" height="100" fill="transparent"/>
          <line class="belt-track" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>
          <rect class="slot-shape" x="${cx - 52}" y="${y - 42}" width="104" height="84" rx="16"/>
          <text class="slot-q" x="${cx}" y="${y + 20}">?</text></g>`;
    }
    if (s.type === 'coord'){
      const xs = [120, 121, 122].map(lon => P(lon, 24)[0]);
      html = xs.map(x => `<line class="meridian" x1="${x}" y1="130" x2="${x}" y2="1300"/>`).join('') +
        `<g id="slotTarget" class="slot target" data-x="${(xs[0] + xs[2]) / 2}" data-y="80">
          <rect class="slot-shape" x="${xs[0] - 30}" y="30" width="${xs[2] - xs[0] + 60}" height="100" rx="24"/>
          <text class="slot-q" x="${(xs[0] + xs[2]) / 2}" y="100">東經 ?°～?°</text></g>`;
    }
    if (s.type === 'ocean'){
      html = Object.entries(OCEAN).map(([dir, o]) => {
        const [x, y] = P(o.lon, o.lat), isT = dir === s.dir;
        return `<g ${isT ? 'id="slotTarget"' : ''} class="slot ${isT ? 'target' : 'decoy'}" data-dir="${dir}" data-x="${x}" data-y="${y}">
          <rect class="slot-shape" x="${x - o.w / 2}" y="${y - o.h / 2}" width="${o.w}" height="${o.h}" rx="28"/>
          <rect x="${x - o.w / 2 + 8}" y="${y - o.h / 2 + 8}" width="${o.w - 16}" height="${o.h - 16}" rx="22" fill="url(#wavePat)" opacity=".7"/>
          ${isT ? `<text class="slot-q" x="${x}" y="${y + 20}">?</text>` : ''}</g>`;
      }).join('');
    }
    $('slotLayer').innerHTML = html;
  },

  /* 拼對之後：點亮插槽、顯示答案 */
  fill(q){
    const s = q.slot, t = $('slotTarget'), p = PIECES[q.answer];
    const x = +t.dataset.x, y = +t.dataset.y;
    t.classList.remove('target', 'hover', 'armed'); t.classList.add('filled');
    let extra = '';
    if (s.type === 'belt'){
      extra = `<text class="slot-icon" x="${x}" y="${y}" style="font-size:54px">🎗️</text>` +
        label(x, y - 92, '北回歸線 23.5°N', 'gold') +
        `<text class="hint-text" x="${P(122.25, 23.5)[0]}" y="${y - 30}">副熱帶 ↑</text>` +
        `<text class="hint-text" x="${P(122.25, 23.5)[0]}" y="${y + 56}">熱帶 ↓</text>`;
    } else if (s.type === 'coord'){
      t.querySelector('.slot-q').textContent = '';
      extra = `<text class="slot-label-plain hint-text" x="${x}" y="${y + 14}" style="font-size:40px">東經 120°～122°</text>` +
        [120, 121, 122].map(lon => `<text class="hint-text" x="${P(lon, 24)[0]}" y="175">${lon}°E</text>`).join('') +
        [22, 25].map(lat => `<line class="meridian" x1="60" y1="${P(120, lat)[1]}" x2="940" y2="${P(120, lat)[1]}" style="stroke:rgba(255,236,150,.95)"/><text class="hint-text" x="110" y="${P(120, lat)[1] - 12}">${lat}°N</text>`).join('');
    } else if (s.type === 'ocean'){
      extra = `<text class="slot-icon" x="${x}" y="${y}">${p.icon}</text>`;
      const names = {N:'東海', E:'太平洋', S:'巴士海峽', W:'臺灣海峽'};
      $('slotLayer').insertAdjacentHTML('beforeend', Object.entries(OCEAN).map(([dir, o]) => {
        const [ox, oy] = P(o.lon, o.lat);
        return label(ox, dir === 'N' || dir === 'S' ? oy + (dir === 'N' ? 80 : -80) : oy + o.h / 2 + 34, names[dir], dir === s.dir ? 'gold' : '');
      }).join(''));
    } else {
      const iy = s.type === 'tribe' ? y - 10 : y;
      extra = `<text class="slot-icon" x="${x}" y="${iy}">${p.icon}</text>` +
        label(x, s.type === 'tribe' ? y + 98 : y + 100, p.text, 'gold');
    }
    t.insertAdjacentHTML('beforeend', extra);
  },

  /* 判斷手指 / 滑鼠是否在目標插槽上（外擴 30px，讓小朋友好放） */
  isOver(cx, cy){
    const t = $('slotTarget'); if (!t) return false;
    const r = t.getBoundingClientRect(), pad = 30;
    return cx > r.left - pad && cx < r.right + pad && cy > r.top - pad && cy < r.bottom + pad;
  },
  center(){
    const t = $('slotTarget'), svg = $('mapSvg').getBoundingClientRect();
    return {x: svg.left + (+t.dataset.x) / MAP.w * svg.width, y: svg.top + (+t.dataset.y) / MAP.h * svg.height};
  }
};

/* =========================================================
   G. 遊戲主程式
   ========================================================= */
const Game = {
  order: [], index: 0, score: 0, tries: 0, firstTry: 0, locked: false,

  init(){
    $('startBtn').addEventListener('click', () => { Sound.unlock(); Sound.pick(); closeOverlay('introOverlay'); this.start(); });
    $('nextBtn').addEventListener('click', () => { Sound.pick(); this.next(); });
    $('restartBtn').addEventListener('click', () => { Sound.pick(); closeOverlay('resultOverlay'); this.start(); });
    $('muteBtn').addEventListener('click', e => {
      const m = Sound.toggle(); e.currentTarget.textContent = m ? '🔇' : '🔊'; $('mediaVideo').muted = m;
    });
  },

  start(){
    this.order = QUESTIONS.map((_, i) => i);   // 依課本順序；想隨機可改成 shuffle(...)
    this.index = 0; this.score = 0; this.firstTry = 0;
    errorStats = { geo_coords: 0, terrain: 0, culture_history: 0 };
    $('scoreNum').textContent = 0;
    this.render();
  },

  get q(){ return QUESTIONS[this.order[this.index]]; },

  render(){
    const q = this.q, total = QUESTIONS.length;
    this.tries = 0; this.locked = false;
    $('progressLabel').textContent = `第 ${this.index + 1} / ${total} 關`;
    $('progressFill').style.width = `${(this.index / total) * 100}%`;
    $('progressBar').setAttribute('aria-valuenow', this.index);
    $('progressBar').setAttribute('aria-valuemax', total);
    const tag = $('unitTag');
    tag.textContent = q.unit.split('：')[0]; tag.classList.toggle('u2', q.unit === U2);
    $('qTitle').textContent = q.title;
    $('qPrompt').textContent = `「${q.prompt}」`;
    $('qTarget').textContent = `📍 拼圖放這裡：${q.target}`;
    Slots.render(q);
    this.renderPieces(q);
  },

  renderPieces(q){
    const box = $('pieces'); box.innerHTML = '';
    const ds = q.distractors.length <= 3 ? q.distractors : shuffle(q.distractors).slice(0, Math.random() < .5 ? 2 : 3);
    shuffle([q.answer, ...ds]).forEach((id, i) => {
      const p = PIECES[id];
      const cell = document.createElement('div'); cell.className = 'slot-cell';
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'piece'; el.dataset.id = id;
      el.style.setProperty('--pc', PIECE_COLORS[i % PIECE_COLORS.length]);
      el.setAttribute('aria-label', `拼圖：${p.text}，${p.sub}`);
      el.innerHTML = `<span class="p-icon">${p.icon}</span><span>${p.text}</span><span class="p-sub">${p.sub}</span>`;
      Drag.bind(el);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.attempt(el); } });
      cell.appendChild(el); box.appendChild(cell);
    });
  },

  /* 只點一下沒有拖：提醒要用拖的 */
  dragTip(el){
    restartAnim(el, 'wrong');
    showToast('<b>要用拖的喔！</b>按住拼圖不要放，拖到地圖上發光的插槽再放開 👆');
  },

  /* 鍵盤（無障礙）：拼圖飛到插槽再判斷 */
  async attempt(el){
    if (this.locked || el.classList.contains('tried')) return;
    this.locked = true;
    el.classList.add('flying');
    const off = Drag.offsetToSlot(el);
    el.style.transform = `translate(${off.x}px, ${off.y}px) scale(.6)`;
    await wait(380);
    el.classList.remove('flying');
    this.locked = false;
    this.judge(el);
  },

  judge(el){
    if (this.locked) return;
    this.tries++;
    if (el.dataset.id === this.q.answer) this.onCorrect(el); else this.onWrong(el);
  },

  async onCorrect(el){
    this.locked = true;
    const q = this.q, gained = SCORE_BY_TRY[Math.min(this.tries - 1, SCORE_BY_TRY.length - 1)];
    if (this.tries === 1) this.firstTry++;
    this.score += gained;

    // 吸附動畫：拼圖縮小滑進插槽
    const snap = Drag.offsetToSlot(el);
    el.style.transition = 'transform .35s cubic-bezier(.3,1.4,.5,1), opacity .35s';
    el.style.transform = `translate(${snap.x}px, ${snap.y}px) scale(.3)`;
    el.style.opacity = '0';
    Sound.success(); restartAnim($('mascot'), 'happy'); hideToast();
    await wait(330);

    Slots.fill(q);
    el.classList.add('gone');
    burstAt(Slots.center());
    $('scoreNum').textContent = this.score; restartAnim($('score'), 'bump');
    $('progressFill').style.width = `${((this.index + 1) / QUESTIONS.length) * 100}%`;
    await wait(900);
    this.openUnlock(gained);
  },

  onWrong(el){
    errorStats[this.q.category]++;
    Sound.wrong();
    el.style.transition = ''; el.style.transform = '';
    el.classList.add('tried'); el.setAttribute('aria-disabled', 'true');
    restartAnim(el, 'wrong'); restartAnim($('slotTarget'), 'shake'); restartAnim($('mascot'), 'sad');
    showToast(`<b>再想想看喔！</b>這個特色屬於別的地方～<br>${PIECES[el.dataset.id].hint}`);
  },

  openUnlock(gained){
    const q = this.q, p = PIECES[q.answer];
    $('unlockTitle').textContent = `${p.icon} ${p.text}`;
    $('earned').textContent = this.tries === 1 ? `一次就答對！+${gained} 分 🎯` : `答對了！+${gained} 分`;
    $('mnemonicText').textContent = q.mnemonic;
    $('examText').innerHTML = emphasize(q.reason);
    Media.show(q, this.order[this.index] + 1);
    $('nextBtn').textContent = this.index === QUESTIONS.length - 1 ? '看我的探險成績 🏆' : '下一題 ➜';
    openOverlay('unlockOverlay');
    $('unlockOverlay').querySelector('.modal').scrollTop = 0;
    $('nextBtn').focus({preventScroll:true});
  },

  next(){
    Media.stop(); closeOverlay('unlockOverlay');
    if (this.index < QUESTIONS.length - 1) { this.index++; this.render(); } else this.finish();
  },

  finish(){
    const total = QUESTIONS.length;
    const stars = this.firstTry >= total - 2 ? 3 : this.firstTry >= Math.ceil(total * .6) ? 2 : 1;
    $('stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    $('finalScore').textContent = `${this.score} / ${total * 100} 分`;
    $('resultMsg').textContent = ['', '探險完成！再玩一次，一定能拿更多星星！', '好厲害！你已經是小小探險家了！', '太神啦！你是臺灣知識大師，期中考穩穩der！'][stars] + `（一次答對 ${this.firstTry} 題）`;
    $('badges').innerHTML = QUESTIONS.map(q => { const p = PIECES[q.answer]; return `<div><span>${p.icon}</span>${p.text}</div>`; }).join('');
    Kit.showResult();
    Sound.fanfare(); openOverlay('resultOverlay');
    $('resultOverlay').querySelector('.modal').scrollTop = 0;
    for (let i = 0; i < 4; i++) setTimeout(() => confetti(), i * 300);
  }
};

/* =========================================================
   G-2. 結算：弱項診斷 + 急救包分頁
   ========================================================= */
const Kit = {
  weakest(){
    const max = Math.max(...KIT_ORDER.map(k => errorStats[k]));
    return max === 0 ? null : KIT_ORDER.find(k => errorStats[k] === max);
  },
  showResult(){
    const weak = this.weakest();
    const max = Math.max(1, ...KIT_ORDER.map(k => errorStats[k]));
    $('errStats').innerHTML = '<div style="font-weight:900">🔍 拖錯次數小調查</div>' + KIT_ORDER.map(k => `
      <div class="err-row ${k === weak ? 'weak' : ''}"><span>${KITS[k].tab.split(' ')[1]}</span>
        <span class="err-bar"><i style="width:${errorStats[k] / max * 100}%"></i></span><b>${errorStats[k]} 次</b></div>`).join('');
    $('diagnoseText').innerHTML = weak
      ? `探險完成！石虎發現你在<b>【${KITS[weak].name}】</b>需要多補給一點元氣喔！特地幫你準備了專屬急救包，快打開看看 👇`
      : '探險完成！你一次都沒有拖錯，真是太厲害了！三個急救包都可以再複習一次，期中考穩穩拿高分 💯';
    $('kitTabs').innerHTML = KIT_ORDER.map(k => `<button class="kit-tab" role="tab" id="tab-${k}" data-kit="${k}" aria-selected="false">${KITS[k].tab}${k === weak ? '<span class="weak-dot">弱項</span>' : ''}</button>`).join('');
    $('kitTabs').querySelectorAll('.kit-tab').forEach(b => b.addEventListener('click', () => { Sound.pick(); this.open(b.dataset.kit); }));
    this.open(weak || KIT_ORDER[0]);
  },
  open(key){
    const k = KITS[key];
    $('kitTabs').querySelectorAll('.kit-tab').forEach(b => b.setAttribute('aria-selected', b.dataset.kit === key));
    $('kitPanel').setAttribute('aria-labelledby', `tab-${key}`);
    $('kitPanel').innerHTML = `
      <div class="infographic-box">
        <!-- 請在此替換 Kling 生成的急救包大圖 -->
        <img class="infographic-img" src="${k.img}" alt="${k.name} 圖解" onerror="this.hidden=true">
        <div class="infographic-ph"><span>${k.ph}</span>Kling 圖解預留位置</div>
      </div>
      <p class="kit-intro">🐾 ${k.intro}</p>
      <div class="kit-cards">${k.cards.map(c => `<div class="kit-card" style="--kc:${c.color}"><h4>${c.icon} ${c.title}</h4>${c.html}</div>`).join('')}</div>
      <div class="kit-mnemonic"><h4>💡 30 秒口訣</h4><p>${k.mnemonic}</p></div>`;
  }
};

/* =========================================================
   H. 拖曳（Pointer Events：同時支援滑鼠與手機觸控）
   ========================================================= */
const Drag = {
  cur: null,
  bind(el){
    el.addEventListener('pointerdown', e => this.down(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.up(e));
    el.addEventListener('pointercancel', e => this.cancel(e));
    el.addEventListener('touchstart', e => { if (!el.classList.contains('tried')) e.preventDefault(); }, {passive:false});
  },
  down(e){
    const el = e.currentTarget;
    if (Game.locked || el.classList.contains('tried') || this.cur) return;
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    this.cur = {el, pid:e.pointerId, sx:e.clientX, sy:e.clientY, moved:false};
    Sound.unlock();
  },
  move(e){
    const c = this.cur; if (!c || e.pointerId !== c.pid) return;
    const dx = e.clientX - c.sx, dy = e.clientY - c.sy;
    if (!c.moved && Math.hypot(dx, dy) > 8){
      c.moved = true;
      c.el.classList.add('dragging'); Sound.pick();
    }
    if (c.moved){
      const over = Slots.isOver(e.clientX, e.clientY);
      c.el.style.transform = `translate(${dx}px, ${dy}px) scale(${over ? .75 : 1.04}) rotate(-2deg)`;
      $('slotTarget').classList.toggle('hover', over);
    }
  },
  up(e){
    const c = this.cur; if (!c || e.pointerId !== c.pid) return;
    this.cur = null;
    const el = c.el; el.classList.remove('dragging'); $('slotTarget').classList.remove('hover');
    if (!c.moved){ Game.dragTip(el); return; }
    if (Slots.isOver(e.clientX, e.clientY)) Game.judge(el);
    else el.style.transform = '';
  },
  cancel(e){
    const c = this.cur; if (!c || e.pointerId !== c.pid) return;
    this.cur = null; c.el.classList.remove('dragging'); c.el.style.transform = ''; $('slotTarget').classList.remove('hover');
  },
  /* 拼圖「原位中心」到插槽中心的位移 */
  offsetToSlot(el){
    const prev = el.style.transform, prevT = el.style.transition;
    el.style.transition = 'none'; el.style.transform = 'none';
    const r = el.getBoundingClientRect();
    el.style.transform = prev; void el.offsetWidth; el.style.transition = prevT;
    const c = Slots.center();
    return {x: c.x - (r.left + r.width / 2), y: c.y - (r.top + r.height / 2)};
  }
};

/* =========================================================
   I. 媒體（Kling 影片 / GIF / 預留位置）
   ========================================================= */
const Media = {
  show(q, no){
    const v = $('mediaVideo'), img = $('mediaImg'), ph = $('mediaPlaceholder');
    v.hidden = img.hidden = true; ph.hidden = false;
    ph.style.setProperty('--ph-bg', q.bg);
    $('phScene').textContent = q.scene;
    $('phLabel').textContent = `🎬 Kling 動畫預留位置 #${no}`;
    $('phPrompt').textContent = q.kling;
    const src = (q.media || '').trim();
    if (!src) return;
    if (/\.(mp4|webm|mov)(\?|$)/i.test(src)){
      v.onerror = () => { v.hidden = true; ph.hidden = false; };
      v.src = src; v.hidden = false; ph.hidden = true;
      v.muted = Sound.isMuted(); v.currentTime = 0;
      v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
    } else {
      img.onerror = () => { img.hidden = true; ph.hidden = false; };
      img.alt = `${q.title} 動畫`; img.src = src; img.hidden = false; ph.hidden = true;
    }
  },
  stop(){ const v = $('mediaVideo'); v.pause(); v.removeAttribute('src'); v.load(); }
};

/* =========================================================
   J. 介面小元件
   ========================================================= */
function openOverlay(id){ $(id).classList.add('open'); }
function closeOverlay(id){ $(id).classList.remove('open'); }
let toastTimer = null;
function showToast(html){ $('toastText').innerHTML = html; $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 3800); }
function hideToast(){ $('toast').classList.remove('show'); }
const COLORS = ['#ffc94a', '#ff8a3d', '#3fae6a', '#5fb7d4', '#e8565a', '#b98cff'];
function spark(x, y, dx, dy, i, dur){
  const s = document.createElement('div'); s.className = 'spark';
  s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.background = COLORS[i % COLORS.length];
  s.style.setProperty('--dx', dx + 'px'); s.style.setProperty('--dy', dy + 'px');
  if (dur) s.style.animationDuration = dur + 's';
  document.body.appendChild(s); setTimeout(() => s.remove(), 2800);
}
function burstAt({x, y}){ for (let i = 0; i < 26; i++){ const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 110; spark(x, y, Math.cos(a) * d, Math.sin(a) * d, i); } }
function confetti(){ for (let i = 0; i < 40; i++) spark(Math.random() * innerWidth, -10, (Math.random() - .5) * 120, innerHeight * (.6 + Math.random() * .5), i, 1.6 + Math.random()); }

Game.init();
</script>
