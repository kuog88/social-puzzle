<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社會科探險島・選擇年級</title>
<style>
:root{--ink:#232323;--font:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font);font-weight:700;color:var(--ink);min-height:100dvh;
  background:linear-gradient(180deg,#7cc8ff 0%,#c8ecff 60%,#5dbb3f 60%,#5dbb3f 64%,#8b5a2b 64%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 14px 80px;gap:18px;
}
h1{margin:0;text-align:center;font-size:clamp(26px,6.5vw,46px);font-weight:900;color:#fff;line-height:1.3;
  text-shadow:3px 3px 0 #2b5e1c,-2px -2px 0 #2b5e1c,2px -2px 0 #2b5e1c,-2px 2px 0 #2b5e1c,5px 6px 0 rgba(0,0,0,.25)}
.sub{margin:0;background:rgba(255,255,255,.8);padding:6px 16px;border-radius:99px;font-size:18px;text-align:center}
.grades{display:grid;grid-template-columns:repeat(2,minmax(0,360px));gap:20px;width:100%;justify-content:center}
.grade{
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px 20px;text-decoration:none;color:var(--ink);text-align:center;
  border:4px solid var(--ink);border-radius:14px;transition:transform .12s;
  box-shadow:inset -6px -6px 0 rgba(0,0,0,.18), inset 6px 6px 0 rgba(255,255,255,.4), 0 7px 0 rgba(0,0,0,.35);
}
.grade:hover{transform:translateY(-5px)}
.grade:active{transform:translateY(3px)}
.g3{background:#eaffdf}
.g5{background:#fff3d6}
.grade svg{width:110px;height:110px;shape-rendering:crispEdges;animation:bob 2.2s ease-in-out infinite}
.g5 svg{animation-delay:-1.1s}
.badge{font-size:20px;font-weight:900;color:#fff;padding:4px 18px;border-radius:99px;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.g3 .badge{background:#3f8f2a}
.g5 .badge{background:#d9771a}
.name{font-size:clamp(21px,4.8vw,26px);font-weight:900;line-height:1.35}
.desc{font-size:16px;color:#5f5240;line-height:1.6}
.go{margin-top:4px;font-size:20px;font-weight:900;color:#fff;padding:10px 24px;border:4px solid var(--ink);border-radius:10px;
  box-shadow:inset -5px -5px 0 rgba(0,0,0,.25), inset 5px 5px 0 rgba(255,255,255,.3);text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.g3 .go{background:#5dbb3f}
.g5 .go{background:#ff8a3d}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:640px){.grades{grid-template-columns:1fr}.grade svg{width:84px;height:84px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
  <h1>🗺️ 社會科探險島</h1>
  <p class="sub">你是幾年級的探險家？選一個年級出發吧！</p>
  <div class="grades">
    <a class="grade g3" href="grade3.html">
      <!-- 像素草地方塊 -->
      <svg viewBox="0 0 8 8" aria-hidden="true">
        <rect width="8" height="2" fill="#5dbb3f"/><rect x="1" y="1" width="1" height="1" fill="#3f8f2a"/><rect x="5" y="1" width="1" height="1" fill="#3f8f2a"/>
        <rect y="2" width="8" height="6" fill="#8b5a2b"/><rect x="1" y="2" width="1" height="1" fill="#5dbb3f"/><rect x="4" y="2" width="1" height="1" fill="#5dbb3f"/><rect x="6" y="2" width="1" height="1" fill="#5dbb3f"/>
        <rect x="2" y="4" width="1" height="1" fill="#5e3a19"/><rect x="6" y="4" width="1" height="1" fill="#5e3a19"/><rect x="1" y="6" width="1" height="1" fill="#5e3a19"/><rect x="7" y="6" width="1" height="1" fill="#5e3a19"/>
      </svg>
      <span class="badge">三年級</span>
      <span class="name">🎒 麥塊校園大冒險</span>
      <span class="desc">班會開會流程・校園處室與幹部<br>生活作息與個人隱私</span>
      <span class="go">進入三年級 ▶</span>
    </a>
    <a class="grade g5" href="social_puzzle.html">
      <!-- 像素石虎 -->
      <svg viewBox="0 0 16 14" aria-hidden="true">
        <rect x="2" y="0" width="2" height="1" fill="#7a4a22"/><rect x="12" y="0" width="2" height="1" fill="#7a4a22"/>
        <rect x="1" y="1" width="4" height="1" fill="#d9964f"/><rect x="11" y="1" width="4" height="1" fill="#d9964f"/>
        <rect x="1" y="2" width="14" height="11" fill="#d9964f"/><rect x="0" y="4" width="16" height="6" fill="#d9964f"/>
        <rect x="6" y="2" width="1" height="3" fill="#fff3e0"/><rect x="9" y="2" width="1" height="3" fill="#fff3e0"/>
        <rect x="2" y="5" width="1" height="1" fill="#7a4a22"/><rect x="13" y="5" width="1" height="1" fill="#7a4a22"/>
        <rect x="3" y="6" width="1" height="2" fill="#fff3e0"/><rect x="4" y="6" width="1" height="2" fill="#232323"/>
        <rect x="11" y="6" width="1" height="2" fill="#fff3e0"/><rect x="12" y="6" width="1" height="2" fill="#232323"/>
        <rect x="5" y="9" width="6" height="3" fill="#fff3e0"/><rect x="7" y="9" width="2" height="1" fill="#f29a9a"/>
        <rect x="0" y="13" width="0" height="0" fill="none"/>
      </svg>
      <span class="badge">五年級</span>
      <span class="name">🗺️ 石虎探險家・臺灣拼圖大冒險</span>
      <span class="desc">板塊與地形・經緯度與海域<br>史前文化與原住民族</span>
      <span class="go">進入五年級 ▶</span>
    </a>
  </div>
<script src="https://kuog88.github.io/home-button.js" defer></script>
</body>
</html>
