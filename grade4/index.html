<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四年級社會・家鄉探險隊（四上）</title>
<link rel="stylesheet" href="style.css?v=20261104m">
<link rel="stylesheet" href="../assets/rwd.css?v=20261103v">
</head>
<body>
<div class="cloud" style="top:6%"></div><div class="cloud c2"></div>

<div class="app">
  <header class="topbar">
    <a class="px-btn grade-btn" href="../index.html">← 選年級</a>
    <button class="px-btn home-btn" id="homeBtn" hidden>⬅ 回大廳</button>
    <div class="title px" id="topTitle">🏝️ 四年級社會・家鄉探險隊</div>
    <button class="px-btn mute-btn" id="muteBtn" aria-label="音效開關">🔊</button>
  </header>

  <!-- 大廳 -->
  <section class="screen active" id="lobby">
    <h1 class="lobby-title">家鄉探險隊</h1>
    <p class="lobby-sub" id="lobbySub">四年級上學期社會｜收集全部 ⭐ 成為家鄉小導遊！</p>
    <div id="verBar"></div>
    <div class="total px" id="totalStars"></div>
    <div class="portals" id="portals"></div>
    <section class="exam-sec" aria-label="月考測驗卷"><div id="exam-box"></div></section>
    <button class="px-btn wood notes-btn" id="resetBtn">🧹 清除星星紀錄</button>
  </section>

  <!-- 單元：選關卡 -->
  <section class="screen" id="unit">
    <div class="level-head px"><h2 id="unitTitle"></h2><span class="chip" id="unitChip"></span></div>
    <p class="unit-desc px" id="unitDesc"></p>
    <div class="levels" id="levels"></div>
  </section>

  <!-- 關卡 -->
  <section class="screen" id="play">
    <div class="level-head px">
      <h2 id="lvTitle"></h2>
      <span class="chip" id="lvKind"></span>
      <span class="chip warn" id="lvTimer" hidden></span>
      <span class="chip" id="lvProg"></span>
    </div>
    <div class="ask px"><span id="lvAsk"></span><button class="px-btn stone say-btn" id="sayBtn" aria-label="朗讀題目">🔈 唸給我聽</button></div>
    <div class="stage" id="stage"></div>
  </section>
</div>

<div class="overlay" id="overlay"><div class="modal px" role="dialog" aria-modal="true" id="modal"></div></div>
<div class="toast" id="toast" role="status" aria-live="assertive"></div>

<script src="https://kuog88.github.io/kg-ver.js?v=20261103v"></script>
<script src="js/book.js?v=20261104m"></script>
<script src="data.js?v=20261103v"></script>
<script src="js/map-rescue.js?v=20261104m"></script>
<script src="exam-bank.js?v=20261104m"></script>
<script>
/* 月考測驗卷依目前版本、範圍組卷；切換版本或範圍時重新掛上 */
function mountExam() { if (window.KGExam) KGExam.mount(document.getElementById('exam-box'), window.KGVer ? KGVer.examBank(BOOK, EXAM_BANK) : EXAM_BANK); }
</script>
<script src="game.js?v=20261104m"></script>
<script src="https://kuog88.github.io/kg-exam.js" defer></script>
<script>
window.KGVer && KGVer.bar(document.getElementById('verBar'), BOOK, function () { renderLobby(); });
window.addEventListener('load', function m() { if (window.KGExam) mountExam(); else setTimeout(m, 200); });
</script>
<script src="../assets/rwd.js?v=20261103v"></script>
<script src="https://kuog88.github.io/home-button.js" defer></script>
<script src="https://kuog88.github.io/bgm.js" defer></script>
</body>
</html>
