<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五年級社會・福爾摩沙時光探險隊（翰林五上）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cloud" style="top:6%"></div><div class="cloud c2"></div>

<div class="app">
  <header class="topbar">
    <a class="px-btn grade-btn" href="../index.html">← 選年級</a>
    <button class="px-btn home-btn" id="homeBtn" hidden>⬅ 回大廳</button>
    <div class="title px" id="topTitle">🧭 五年級社會・福爾摩沙時光探險隊</div>
    <button class="px-btn mute-btn" id="muteBtn" aria-label="音效開關">🔊</button>
  </header>

  <!-- 大廳 -->
  <section class="screen active" id="lobby">
    <h1 class="lobby-title">福爾摩沙時光探險隊</h1>
    <p class="lobby-sub">五福國小・五年級上學期社會（翰林版）｜從地圖出發，穿越史前、大航海、清帝國時代，收集全部 ⭐！</p>
    <div class="total px" id="totalStars"></div>
    <div class="portals" id="portals"></div>
    <button class="px-btn wood notes-btn" id="resetBtn">🧹 清除星星紀錄</button>
  </section>

  <!-- 單元：選關卡 -->
  <section class="screen" id="unit">
    <div class="level-head px"><h2 id="unitTitle"></h2><span class="chip" id="unitChip"></span></div>
    <p class="unit-desc px" id="unitDesc"></p>
    <div class="levels" id="levels"></div>
  </section>

  <!-- 關卡 -->
  <section class="screen" id="play">
    <div class="level-head px">
      <h2 id="lvTitle"></h2>
      <span class="chip" id="lvKind"></span>
      <span class="chip warn" id="lvTimer" hidden></span>
      <span class="chip" id="lvProg"></span>
    </div>
    <div class="ask px"><span id="lvAsk"></span><button class="px-btn stone say-btn" id="sayBtn" aria-label="朗讀題目">🔈 唸給我聽</button></div>
    <div class="stage" id="stage"></div>
  </section>
</div>

<div class="overlay" id="overlay"><div class="modal px" role="dialog" aria-modal="true" id="modal"></div></div>
<div class="toast" id="toast" role="status" aria-live="assertive"></div>

<script src="data.js"></script>
<script src="game.js"></script>
<script src="https://kuog88.github.io/home-button.js" defer></script>
<script src="https://kuog88.github.io/bgm.js" defer></script>
</body>
</html>
